<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Strictest CSP — this window renders model output as HTML: no network, no inline script/style. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Sidekick Chat</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="chat.css" />
    <link rel="stylesheet" href="markdown.css" />
    <link rel="stylesheet" href="confirm-dialog.css" />
  </head>

  <body>
    <div class="titlebar">
      <span class="dot"></span>
      <span class="titlebar-text">Quick Chat</span>
      <button class="titlebar-btn" id="history-btn" type="button" title="Saved chats">Saved</button>
      <button class="titlebar-btn" id="new-btn" type="button" title="New chat">New</button>
      <button class="titlebar-close" id="close-btn" type="button" title="End session">✕</button>
    </div>

    <div class="disclaimer">
      <span class="disclaimer-icon">🔒</span>
      <span>
        Not saved unless you save it · AI can make mistakes · using
        <span class="model-badge" id="model-name">—</span>
      </span>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <span class="hint-icon">💬</span>
        <p>
          Ask anything.<br />
          <strong>Enter</strong> to send &nbsp;·&nbsp; <strong>Shift+Enter</strong> for a new line.
        </p>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Ask something…"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button id="send-btn" type="button" title="Send (Enter)">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" />
        </svg>
      </button>
    </div>

    <div class="confirm-overlay" id="confirm-overlay" hidden>
      <div class="confirm-dialog">
        <div class="confirm-icon">💬</div>
        <h2 class="confirm-title">Save this chat?</h2>
        <p class="confirm-desc">
          Save it to revisit later with its full context, or discard it and start fresh.
        </p>
        <div class="confirm-actions">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-discard" type="button">Don't save</button>
          <button id="confirm-save" type="button">Save chat</button>
        </div>
      </div>
    </div>

    <div class="history-panel" id="history-panel" hidden>
      <div class="history-header">
        <span class="history-title">Saved chats</span>
        <button class="titlebar-close" id="history-close" type="button" title="Close">✕</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">No saved chats yet.</div>
      </div>
    </div>

    <script type="module" src="chat.js"></script>
  </body>
</html>
