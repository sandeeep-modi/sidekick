<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      body {
        font: 12px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      .pill {
        display: inline-flex; align-items: center; gap: 9px;
        margin: 8px; padding: 9px 13px;
        background: #ffffff; border: 1px solid #ececf1; border-radius: 12px;
        box-shadow: 0 6px 22px rgba(30, 30, 50, 0.18);
        color: #33343a;
      }
      .spin {
        width: 14px; height: 14px; flex: none;
        border: 2px solid #e2e4ef; border-top-color: #2fbf63; border-radius: 50%;
        animation: s 0.7s linear infinite;
      }
      @keyframes s { to { transform: rotate(360deg); } }
      .dot {
        width: 15px; height: 15px; flex: none; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; color: #fff;
      }
      .ok { background: #34c46b; }
      .err { background: #d9a1a1; }
      .label {
        font-weight: 600; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; max-width: 168px;
      }
      .label.muted { color: #8b8c96; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="pill">
      <div class="spin" id="icon"></div>
      <div class="label" id="label">Rewriting…</div>
    </div>
    <script>
      const icon = document.getElementById("icon");
      const label = document.getElementById("label");
      window.setState = function (state, text) {
        if (state === "done") {
          icon.className = "dot ok";
          icon.textContent = "✓";
          label.className = "label";
          label.textContent = text || "Done";
        } else if (state === "error") {
          icon.className = "dot err";
          icon.textContent = "!";
          label.className = "label muted";
          label.textContent = text || "Error";
        } else {
          icon.className = "spin";
          icon.textContent = "";
          label.className = "label";
          label.textContent = (text ? text + " — " : "") + "Rewriting…";
        }
      };
    </script>
  </body>
</html>
