<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';" />
    <title>Reword</title>
    <style>
      :root {
        --bg: #fafafb;
        --surface: #ffffff;
        --text: #33343a;
        --muted: #8b8c96;
        --border: #ececf1;
        --brand: #72f69b;         /* icon green */
        --accent: #14a05a;        /* readable green for actions/text */
        --accent-soft: #e9f9f0;
        --accent-border: #c7ecd5;
        --ok: #14a05a;
        --err: #d29393;           /* very light red, errors only */
        --err-bg: #fdf4f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 15px 18px 12px;
      }
      header { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
      .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--brand); border: 1px solid #3bd074; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
      .tag { color: var(--muted); font-size: 11.5px; margin: 0 0 13px 23px; }

      .group { margin-bottom: 12px; }
      label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 5px; }

      .row { display: flex; gap: 7px; }
      input[type="password"], input[type="text"], select {
        width: 100%; padding: 8px 10px; border: 1px solid var(--border);
        border-radius: 7px; font-size: 13px; background: var(--surface); color: var(--text);
        font-family: inherit;
      }
      input:focus, select:focus { outline: none; border-color: var(--accent); }

      button {
        font: inherit; cursor: pointer; border: 1px solid var(--border);
        border-radius: 7px; padding: 8px 12px; font-size: 12.5px; font-weight: 600;
        background: var(--surface); color: var(--text);
      }
      button:hover { background: #f4f4f7; }
      button.small { padding: 8px 11px; }
      button.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
      button.accent:hover { background: #dcf5e6; }

      .tones { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .tone {
        display: flex; align-items: center; gap: 7px; padding: 8px 10px;
        border: 1px solid var(--border); border-radius: 7px; cursor: pointer; background: var(--surface);
      }
      .tone.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      .tone input { accent-color: var(--accent); }

      .shortcut {
        display: flex; align-items: center; justify-content: space-between;
        border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; background: var(--surface);
      }
      .shortcut code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; }
      .shortcut.recording { border-color: var(--accent); background: var(--accent-soft); }

      .switch { display: flex; align-items: center; gap: 9px; }
      .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
      .switch label { margin: 0; font-weight: 500; }

      .divider { height: 1px; background: var(--border); margin: 2px 0 11px; }
      .actions { display: flex; gap: 7px; }
      .actions .grow { flex: 1; }

      #status { min-height: 18px; font-size: 12px; margin-top: 11px; font-weight: 600; }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      .errbox {
        background: var(--err-bg); border: 1px solid #f3e0e0; color: #b57b7b;
        border-radius: 7px; padding: 8px 10px; font-size: 11.5px; margin-top: 8px;
        white-space: pre-wrap; display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1>Reword</h1>
    </header>
    <p class="tag">Select text anywhere, press your shortcut, and it's rewritten in place.</p>

    <div class="group">
      <label for="key">Gemini API key</label>
      <div class="row">
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" />
        <button id="toggle" class="small" type="button">Show</button>
      </div>
      <div class="hint">Stored only on this computer. Get one free at aistudio.google.com/apikey</div>
    </div>

    <div class="group">
      <label for="model">Model</label>
      <select id="model"></select>
    </div>

    <div class="group">
      <label>Default tone</label>
      <div class="tones" id="tones"></div>
    </div>

    <div class="group">
      <label>Shortcut</label>
      <div class="shortcut" id="shortcut">
        <code id="shortcutText">—</code>
        <button id="record" class="small" type="button">Change</button>
      </div>
      <div class="hint">Select text in any app, then press this to rewrite it.</div>
    </div>

    <div class="group switch">
      <input id="autolaunch" type="checkbox" />
      <label for="autolaunch">Start Reword at login</label>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button id="save" class="accent grow" type="button">Save</button>
      <button id="test" type="button">Test key</button>
      <button id="quit" type="button">Quit</button>
    </div>
    <div id="status"></div>
    <div id="errbox" class="errbox"></div>

    <script src="index.js"></script>
  </body>
</html>
